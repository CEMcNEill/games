<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>Bug Survivors</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  /* Phones in portrait: the game is landscape, so ask for a turn. */
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #fcfcfc; font: 16px/1.5 system-ui, sans-serif;
    align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #rotate b { display: block; font-size: 44px; margin-bottom: 8px; }
  @media (orientation: portrait) and (hover: none) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div><b>&#8635;</b>Turn your phone sideways to play</div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
